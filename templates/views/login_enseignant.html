<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPlan — Connexion Enseignant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #064e3b 0%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.2;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 { width: 400px; height: 400px; background: #10b981; top: -100px; left: -100px; }
    .orb-2 { width: 300px; height: 300px; background: #059669; bottom: -50px; right: -50px; animation-delay: 2s; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .login-box {
      width: 100%; max-width: 420px; padding: 40px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      color: #fff;
      position: relative; /* Indispensable pour que le z-index fonctionne */
      z-index: 10;
      animation: slideUp 0.5s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .icon-wrap {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, #10b981, #059669);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; margin: 0 auto 24px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
    }
    h2 { font-weight: 700; text-align: center; margin-bottom: 8px; font-size: 26px; }
    p.subtitle { text-align: center; color: rgba(255, 255, 255, 0.6); margin-bottom: 32px; font-size: 14px; }
    .form-control {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff; border-radius: 12px; padding: 12px 16px;
    }
    .form-control:focus {
      background: rgba(0, 0, 0, 0.3); border-color: #10b981;
      color: #fff; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
    }
    .form-control::placeholder { color: rgba(255, 255, 255, 0.4); }
    .btn-login {
      width: 100%; padding: 12px; border-radius: 12px; font-weight: 600;
      background: linear-gradient(135deg, #10b981, #059669);
      border: none; color: #fff; margin-top: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); color:#fff; }
    .back-link {
      display: block; text-align: center; margin-top: 24px;
      color: rgba(255, 255, 255, 0.5); font-size: 14px; text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="login-box">
    <div class="icon-wrap"><i class="bi bi-person-workspace"></i></div>
    <h2>Espace Enseignant</h2>
    <p class="subtitle">Accédez à votre planning et vos affectations</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} small py-2 text-center" role="alert" style="border-radius: 8px;">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-white-50">Adresse email académique</label>
        <input type="email" class="form-control" name="identifiant" placeholder="prenom.nom@univ.fr" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold text-white-50">Mot de passe</label>
        <input type="password" class="form-control" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-login">Se connecter <i class="bi bi-arrow-right ms-1"></i></button>
    </form>
    <a href="/" class="back-link"><i class="bi bi-arrow-left me-1"></i> Retour au portail</a>
  </div>
</body>
</html>
